<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fastrr Checkout Test</title>
  <link rel="stylesheet" href="https://checkout-ui.shiprocket.com/assets/styles/shopify.css">
  <script src="https://checkout-ui.shiprocket.com/assets/js/channels/shopify.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Shiprocket Fastrr 1-Click Checkout Test</h2>
  <button id="fastrrBtn" style="padding: 14px 28px; font-size: 16px; background: #5B1E31; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
    ⚡ Pay with Fastrr 1-Click
  </button>
  <div id="logs" style="margin-top: 20px; white-space: pre-wrap; font-family: monospace; background: #f0f0f0; padding: 10px;"></div>

  <script>
    const log = (msg) => {
      document.getElementById('logs').textContent += msg + '\n';
      console.log(msg);
    };

    log('HeadlessCheckout available: ' + (typeof window.HeadlessCheckout !== 'undefined'));

    document.getElementById('fastrrBtn').onclick = async (e) => {
      log('Creating Fastrr Session via valeriejewels.in...');
      try {
        const res = await fetch('https://valeriejewels.in/api/fastrr/create_session.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: [
              {
                id: 20,
                variant_id: 20,
                name: 'Kundan Floral Choker Necklace',
                price: 899,
                quantity: 1,
                image: 'https://valeriejewels.in/assets/uploads/products/prod_1.jpg'
              }
            ],
            couponCode: '',
            discountAmount: 0
          })
        });
        const data = await res.json();
        log('Session response: ' + JSON.stringify(data));

        if (!data.success || !data.data?.token) {
          log('Failed to obtain token: ' + JSON.stringify(data));
          return;
        }

        const token = data.data.token;
        log('Calling window.HeadlessCheckout.addToCart with token: ' + token);

        if (window.HeadlessCheckout && typeof window.HeadlessCheckout.addToCart === 'function') {
          window.HeadlessCheckout.addToCart(e, token, {
            fallbackUrl: window.location.href
          }, (callbackData) => {
            log('Fastrr callback: ' + JSON.stringify(callbackData));
          });
          log('addToCart called successfully!');
        } else {
          log('window.HeadlessCheckout.addToCart not found!');
        }
      } catch (err) {
        log('Error: ' + err.message);
      }
    };
  </script>
</body>
</html>
