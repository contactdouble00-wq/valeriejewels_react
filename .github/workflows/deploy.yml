name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

      - name: Deploy Frontend Build to domain root
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude=api --exclude=wp-config.php --exclude=.env
          path: frontend/dist/
          remote_path: /home/u513962642/domains/valeriejewels.in/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: '65002'
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy PHP API folder
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude=.env --exclude=config/config.local.php
          path: api/
          remote_path: /home/u513962642/domains/valeriejewels.in/public_html/api/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: '65002'
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
